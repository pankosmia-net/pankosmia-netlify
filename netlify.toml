# Netlify configuration for Pankosmia client deployment
#
# Backend: pankosmia-docker on Railway
# Clients: static builds served from Netlify CDN
# API calls: proxied to the backend via redirects (status 200)

[build]
  publish = "netlify_dist"

# -------------------------------------------------------------------
# Backend URL — change this if your backend is at a different address
# -------------------------------------------------------------------
# Every [[redirects]] block below references this URL.
# To change the backend, find-and-replace the Railway URL.

# -------------------------------------------------------------------
# Root → dashboard redirect
# -------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "/clients/main/"
  status = 302

# -------------------------------------------------------------------
# API proxy rules — forward to Railway backend
# -------------------------------------------------------------------

# Burrito endpoints (content read/write)
[[redirects]]
  from = "/burrito/*"
  to = "https://pankosmia-web.up.railway.app/burrito/:splat"
  status = 200

# SSE change notifications — handled by edge function (netlify/edge-functions/notifications.ts)
# Edge functions support streaming; redirect-based proxy does not.

# User settings
[[redirects]]
  from = "/settings/*"
  to = "https://pankosmia-web.up.railway.app/settings/:splat"
  status = 200

# Navigation state (BCV cursor)
[[redirects]]
  from = "/navigation/*"
  to = "https://pankosmia-web.up.railway.app/navigation/:splat"
  status = 200

# App state
[[redirects]]
  from = "/app-state/*"
  to = "https://pankosmia-web.up.railway.app/app-state/:splat"
  status = 200

# GitHub OAuth flow
[[redirects]]
  from = "/auth/*"
  to = "https://pankosmia-web.up.railway.app/auth/:splat"
  status = 200

# Git operations
[[redirects]]
  from = "/git/*"
  to = "https://pankosmia-web.up.railway.app/git/:splat"
  status = 200

# Current user identity
[[redirects]]
  from = "/me"
  to = "https://pankosmia-web.up.railway.app/me"
  status = 200

# i18n
[[redirects]]
  from = "/i18n/*"
  to = "https://pankosmia-web.up.railway.app/i18n/:splat"
  status = 200

# Client config and interfaces
[[redirects]]
  from = "/client-config"
  to = "https://pankosmia-web.up.railway.app/client-config"
  status = 200

[[redirects]]
  from = "/client-interfaces"
  to = "https://pankosmia-web.up.railway.app/client-interfaces"
  status = 200

# List clients
[[redirects]]
  from = "/list-clients"
  to = "https://pankosmia-web.up.railway.app/list-clients"
  status = 200

# Network mode
[[redirects]]
  from = "/net/*"
  to = "https://pankosmia-web.up.railway.app/net/:splat"
  status = 200

# Content utilities (templates, versifications)
[[redirects]]
  from = "/content-utils/*"
  to = "https://pankosmia-web.up.railway.app/content-utils/:splat"
  status = 200

# Admin panel (PR review)
[[redirects]]
  from = "/admin/*"
  to = "https://pankosmia-web.up.railway.app/admin/:splat"
  status = 200

# Temp file storage
[[redirects]]
  from = "/temp/*"
  to = "https://pankosmia-web.up.railway.app/temp/:splat"
  status = 200

# Gitea integration
[[redirects]]
  from = "/gitea/*"
  to = "https://pankosmia-web.up.railway.app/gitea/:splat"
  status = 200

# LLM features
[[redirects]]
  from = "/llm/*"
  to = "https://pankosmia-web.up.railway.app/llm/:splat"
  status = 200

# Video generation
[[redirects]]
  from = "/video/*"
  to = "https://pankosmia-web.up.railway.app/video/:splat"
  status = 200

# Debug
[[redirects]]
  from = "/debug/*"
  to = "https://pankosmia-web.up.railway.app/debug/:splat"
  status = 200

# Version + health
[[redirects]]
  from = "/version"
  to = "https://pankosmia-web.up.railway.app/version"
  status = 200

[[redirects]]
  from = "/health"
  to = "https://pankosmia-web.up.railway.app/health"
  status = 200

# -------------------------------------------------------------------
# SPA fallback rules — serve index.html for client-side routing
# -------------------------------------------------------------------
# Each client is a single-page app; deep URLs need to fall back to
# the client's index.html. These rules must come AFTER the API
# proxy rules (Netlify evaluates redirects in order, first match wins).

[[redirects]]
  from = "/clients/main/*"
  to = "/clients/main/index.html"
  status = 200

[[redirects]]
  from = "/clients/content/*"
  to = "/clients/content/index.html"
  status = 200

[[redirects]]
  from = "/clients/i18n-editor/*"
  to = "/clients/i18n-editor/index.html"
  status = 200

[[redirects]]
  from = "/clients/download/*"
  to = "/clients/download/index.html"
  status = 200

[[redirects]]
  from = "/clients/settings/*"
  to = "/clients/settings/index.html"
  status = 200

[[redirects]]
  from = "/clients/core-local-workspace/*"
  to = "/clients/core-local-workspace/index.html"
  status = 200

[[redirects]]
  from = "/clients/core-contenthandler_obs/*"
  to = "/clients/core-contenthandler_obs/index.html"
  status = 200

[[redirects]]
  from = "/clients/core-contenthandler_version_manager/*"
  to = "/clients/core-contenthandler_version_manager/index.html"
  status = 200

[[redirects]]
  from = "/clients/core-contenthandler-generic/*"
  to = "/clients/core-contenthandler-generic/index.html"
  status = 200
